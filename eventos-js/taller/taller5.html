<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 5: Calculadora</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">Volver al inicio</a>
        <h1>Taller 5: Calculadora</h1>
        <p>Escribe dos números y selecciona una operación.</p>
    </header>

    <main>
        <form id="formTaller5" novalidate>
            <label for="primero">Primer número:</label>
            <input type="number" id="primero">

            <label for="segundo">Segundo número:</label>
            <input type="number" id="segundo">

            <label for="operacion">Operación:</label>
            <select id="operacion">
                <option value="">Selecciona una operación</option>
                <option value="suma">Suma</option>
                <option value="resta">Resta</option>
                <option value="multiplicacion">Multiplicación</option>
                <option value="division">División</option>
            </select>

            <div class="botones">
                <input type="submit" value="Calcular">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller5.js"></script>
</body>
</html>
