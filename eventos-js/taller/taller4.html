<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller 4: Formulario de registro</h1>
        <p>Ingrese sus datos de registro. El formulario mostrará el primer error que encuentre.</p>
    </header>

    <main>
        <form id="formTaller4" novalidate>

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre">

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad">

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo">

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena">

            <label for="confirmarContrasena">Confirmar contraseña:</label>
            <input type="password" id="confirmarContrasena" name="confirmarContrasena">

            <div class="botones">
                <input type="submit" value="Registrarse">
                <input type="reset" value="Limpiar">
            </div>

        </form>

        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller4.js"></script>
</body>
</html>
