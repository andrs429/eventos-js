<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Clasificar una nota</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller 3: El mayor de tres números</h1>
        <p>Desarrolla un programa que permita ingresar tres números y mostrar cuál es el mayor, o avisar si los tres son iguales..</p>
    </header>

    <main>
        <form id="formTaller3" novalidate>
            <label for="num1">Ingrese un número:</label>
            <input type="number" id="num1" step="any">
            <label for="num2">Ingrese un número:</label>
            <input type="number" id="num2" step="any">
            <label for="num3">Ingrese un número:</label>
            <input type="number" id="num3" step="any">

            <div class="botones">
                <input type="submit" value="Verificar">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller3.js"></script>
</body>
</html>
